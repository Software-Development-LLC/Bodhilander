appId: com.bodhilander.app
productName: Bodhilander
copyright: Copyright © 2024

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

# Unpack hooks and native modules from asar
asarUnpack:
  - dist/hooks/**/*
  # BDHLNDR-69: the PWA bundle is served at runtime by express.static, which
  # streams files via fs.createReadStream — that path doesn't work reliably
  # inside an asar archive (sendFile errors propagate, and static handler
  # falls through to the SPA fallback returning JSON-typed errors). Unpacking
  # gives us real on-disk paths for express to serve cleanly.
  - dist/pwa/**/*
  - node_modules/node-pty/**/*
  - node_modules/better-sqlite3/**/*
  - node_modules/sodium-native/**/*
  # Native-module loader used by the remaining prebuilt addons (sodium-native).
  - node_modules/node-gyp-build/**/*

# Include icon files for tray icon and sound files
extraResources:
  - from: build/icon.png
    to: icon.png
  - from: resources/sounds
    to: sounds

# Auto-update configuration
publish:
  provider: github
  owner: Software-Development-LLC
  repo: Bodhilander

# macOS configuration
mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # BDHLNDR-38: no explicit arch list — electron-builder defaults to host
  # arch when unspecified, which is what we want since release.yml now runs
  # each arch on its native runner (macos-14 arm64 + macos-15-intel x64).
  # A hardcoded [x64, arm64] here overrode the CLI --x64/--arm64 flags and
  # caused every matrix job to cross-package both archs, producing colliding
  # DMG filenames and a latest-mac.yml with duplicate sha512 entries that
  # broke auto-update for Intel Mac clients on 3.2.10.
  target:
    - target: dmg
    - target: zip

# Copy conpty.dll for Windows PTY support (runs after packing)
afterPack: scripts/copy-conpty.js

# Notarization (runs after signing)
afterSign: scripts/notarize.js

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# Windows configuration
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: "${productName}-Setup-${version}.${ext}"

# Linux configuration
linux:
  icon: build/icon.png
  category: Development
  maintainer: "Will Long II <sytanek@gmail.com>"
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64

# Disable electron-builder's native module rebuild - it tries to rebuild ALL
# native modules including tree-sitter which is incompatible with Electron's V8.
# The postinstall script handles rebuilding only compatible modules
# (better-sqlite3, sodium-native, sqlite-vec, node-pty) via electron-rebuild.
npmRebuild: false
