appId: com.claudelander.app
productName: ClaudeLander
copyright: Copyright © 2024-2025

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

# Unpack MCP server from asar so Node can execute it directly
asarUnpack:
  - dist/mcp-server/**/*

# Include icon files for tray icon and sound files
extraResources:
  - from: build/icon.png
    to: icon.png
  - from: resources/sounds
    to: sounds

# Auto-update configuration
publish:
  provider: github
  owner: William-Long-II
  repo: claudelander

# macOS configuration
mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

# Notarization (runs after signing)
afterSign: scripts/notarize.js

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# Windows configuration
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: "${productName}-Setup-${version}.${ext}"

# Linux configuration
linux:
  icon: build/icon.png
  category: Development
  maintainer: "Will Long II <sytanek@gmail.com>"
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64

# Rebuild native modules for node-pty and better-sqlite3
npmRebuild: true
