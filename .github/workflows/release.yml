name: Build and Release

on:
  push:
    branches:
      - production
      - development
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Exercise the full pipeline (build → artifacts → release job) but
          publish to a DRAFT release with a -dryrun tag suffix. Drafts create
          no git tag and are invisible to auto-updaters. For validating
          workflow changes end-to-end; delete the draft afterwards.
        type: boolean
        default: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Get version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Decide whether to release, and on which channel (BDHLNDR-32)
        id: check
        env:
          BRANCH: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Beta versions carry a "-beta." pre-release segment (e.g. 3.3.0-beta.1).
          if [[ "$VERSION" == *"-beta."* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

          # Dry run (manual dispatch only): exercise every job regardless of
          # branch/tag gates. The release job publishes a DRAFT with a
          # -dryrun tag suffix — no tag is created, updaters can't see it.
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Dry run: forcing should_release=true (draft release, -dryrun tag suffix)"
            echo "should_release=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Gate which channel each branch is allowed to cut.
          # - production → stable only (no -beta. suffix)
          # - development → beta only (must carry -beta. suffix)
          # This keeps the two channels from accidentally cross-publishing.
          if [[ "$BRANCH" == "production" && "$IS_PRERELEASE" == "true" ]]; then
            echo "Skipping: beta version $VERSION pushed to production. Betas must be cut from development."
            echo "should_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [[ "$BRANCH" == "development" && "$IS_PRERELEASE" == "false" ]]; then
            echo "Skipping: stable version $VERSION pushed to development. Stable cuts go through production."
            echo "should_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Standard "have we already tagged this version?" guard.
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists"
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "Tag v$VERSION does not exist — will create release (prerelease=$IS_PRERELEASE)"
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          # Pinned to windows-2022 (VS 2022) deliberately (#109). GitHub moved
          # the `windows-latest` label to windows-2025-vs2026 (Visual Studio
          # 2026), which the project's node-gyp doesn't yet detect — the
          # postinstall electron-rebuild fails with "Could not find any Visual
          # Studio installation to use". Same build-reproducibility reasoning as
          # the pinned macOS runners below. Revisit when node-gyp/node-pty gain
          # VS 2026 support (or if windows-2022 is retired).
          - os: windows-2022
            platform: win
          # BDHLNDR-38: build each Mac arch on its native runner so postinstall
          # (electron-rebuild) and sharp's optional-dep resolution produce
          # host-native binaries. Cross-packaging from a single arm64 runner
          # previously shipped arm64 .node files inside the x64 DMG, causing
          # Intel Mac users to hang at the splash screen when better-sqlite3
          # failed to load.
          #
          # macos-15-intel is GitHub's current Intel x64 12-core larger runner
          # (retired macos-13 replacement). It's a paid tier (~$0.077/min, ~$1
          # per release) — larger runners don't use the public-repo free quota.
          - os: macos-14
            platform: mac-arm64
          - os: macos-15-intel
            platform: mac-x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The app's build/toolchain Node — deliberately unchanged. The
          # action-version bumps in this file only move the actions' own
          # execution runtime to Node 24.
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Python (for native module builds)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: bun install

      - name: Build application
        run: bun run build

      - name: Build distributables (Linux)
        if: matrix.platform == 'linux'
        run: bun run dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build distributables (Windows)
        if: matrix.platform == 'win'
        run: bun run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build distributables (macOS)
        if: startsWith(matrix.platform, 'mac')
        run: bunx electron-builder --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.platform }}
          # The release job in this same run re-uploads everything to a GitHub
          # Release immediately after; nothing downstream needs this copy.
          retention-days: 1
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.zip
            release/latest*.yml
          if-no-files-found: ignore

  release:
    needs: [check-version, build]
    if: always() && needs.check-version.outputs.should_release == 'true' && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      # BDHLNDR-38: each mac matrix job produces its own arch-scoped
      # latest-mac.yml. Merge into one so electron-updater clients see both
      # DMGs and pick the right arch. Then remove the per-job files so the
      # release upload glob doesn't race on identical filenames.
      - name: Merge latest-mac.yml from arm64 and x64 builds
        run: |
          pip install pyyaml
          python3 scripts/merge-latest-mac.py \
            artifacts/dist-mac-arm64/latest-mac.yml \
            artifacts/dist-mac-x64/latest-mac.yml \
            artifacts/latest-mac.yml
          rm artifacts/dist-mac-arm64/latest-mac.yml artifacts/dist-mac-x64/latest-mac.yml

      # Rename channel feeds for beta releases (BDHLNDR-32). electron-builder's
      # GitHub publish provider always writes `latest*.yml` regardless of the
      # semver pre-release suffix, so we rename them post-build to `beta*.yml`
      # so beta-channel opt-ins can find the feed. This runs AFTER the mac
      # merge so the merged artifacts/latest-mac.yml is renamed too.
      - name: Rename channel feeds for beta releases
        if: needs.check-version.outputs.is_prerelease == 'true'
        run: |
          find artifacts -name "latest*.yml" -type f | while read -r f; do
            newname="${f//latest/beta}"
            mv "$f" "$newname"
            echo "Renamed: $f → $newname"
          done

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          # Dry runs publish a DRAFT under a -dryrun tag suffix: drafts never
          # create the git tag and are invisible to auto-updaters.
          tag_name: v${{ needs.check-version.outputs.version }}${{ inputs.dry_run == true && '-dryrun' || '' }}
          name: ${{ inputs.dry_run == true && format('DRY RUN — Bodhilander v{0}', needs.check-version.outputs.version) || needs.check-version.outputs.is_prerelease == 'true' && format('Bodhilander v{0} (beta)', needs.check-version.outputs.version) || format('Bodhilander v{0}', needs.check-version.outputs.version) }}
          draft: ${{ inputs.dry_run == true }}
          prerelease: ${{ needs.check-version.outputs.is_prerelease }}
          generate_release_notes: true
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
