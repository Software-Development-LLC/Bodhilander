name: Build and Release

on:
  push:
    branches:
      - production
      - development
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Exercise the full pipeline (build → artifacts → release job) but
          publish to a DRAFT release with a -dryrun tag suffix. Drafts create
          no git tag and are invisible to auto-updaters. For validating
          workflow changes end-to-end; delete the draft afterwards.
        type: boolean
        default: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Get version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Decide whether to release, and on which channel (BDHLNDR-32)
        id: check
        env:
          BRANCH: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Beta versions carry a "-beta." pre-release segment (e.g. 3.3.0-beta.1).
          if [[ "$VERSION" == *"-beta."* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

          # Dry run (manual dispatch only): exercise every job regardless of
          # branch/tag gates. The release job publishes a DRAFT with a
          # -dryrun tag suffix — no tag is created, updaters can't see it.
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Dry run: forcing should_release=true (draft release, -dryrun tag suffix)"
            echo "should_release=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Gate which channel each branch is allowed to cut.
          # - production → stable only (no -beta. suffix)
          # - development → beta only (must carry -beta. suffix)
          # This keeps the two channels from accidentally cross-publishing.
          if [[ "$BRANCH" == "production" && "$IS_PRERELEASE" == "true" ]]; then
            echo "Skipping: beta version $VERSION pushed to production. Betas must be cut from development."
            echo "should_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [[ "$BRANCH" == "development" && "$IS_PRERELEASE" == "false" ]]; then
            echo "Skipping: stable version $VERSION pushed to development. Stable cuts go through production."
            echo "should_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Standard "have we already tagged this version?" guard.
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists"
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "Tag v$VERSION does not exist — will create release (prerelease=$IS_PRERELEASE)"
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            platform: linux
          # Pinned to windows-2022 (VS 2022) deliberately (#109). GitHub moved
          # the `windows-latest` label to windows-2025-vs2026 (Visual Studio
          # 2026), which the project's node-gyp doesn't yet detect — the
          # postinstall electron-rebuild fails with "Could not find any Visual
          # Studio installation to use". Same build-reproducibility reasoning as
          # the pinned macos-14 runner below. Revisit when node-gyp/node-pty gain
          # VS 2026 support (or if windows-2022 is retired).
          - runs-on: windows-2022
            platform: win
          # BDHLNDR-38: build each Mac arch on its native runner so postinstall
          # (electron-rebuild) and sharp's optional-dep resolution produce
          # host-native binaries. Cross-packaging from a single arm64 runner
          # previously shipped arm64 .node files inside the x64 DMG, causing
          # Intel Mac users to hang at the splash screen when better-sqlite3
          # failed to load.
          #
          # mac-x64 runs on the org's self-hosted Intel Macs (macOS 15), whose
          # workspace and home persist between runs. It builds with the box's
          # Command Line Tools python3, not setup-python. Labels never fall
          # back: if those Macs are offline, edit this entry back to
          # `macos-15-intel`.
          - runs-on: macos-14
            platform: mac-arm64
          - runs-on: [self-hosted, macOS, X64, intel]
            platform: mac-x64
            self-hosted: true
    runs-on: ${{ matrix.runs-on }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Python (for native module builds)
        if: ${{ !matrix.self-hosted }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Check the self-hosted Mac toolchain
        if: ${{ matrix.self-hosted }}
        run: |
          if ! xcode-select -p >/dev/null 2>&1; then
            echo "::error::Xcode Command Line Tools are not installed on $RUNNER_NAME (run xcode-select --install)."
            exit 1
          fi
          if ! command -v python3 >/dev/null 2>&1 || ! python3 --version; then
            echo "::error::python3 is not available on $RUNNER_NAME; node-gyp needs it for the native module rebuild."
            exit 1
          fi

      - name: Install dependencies
        run: bun install

      - name: Build application
        run: bun run build

      - name: Build distributables (Linux)
        if: matrix.platform == 'linux'
        run: bun run dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build distributables (Windows)
        if: matrix.platform == 'win'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Azure Trusted Signing (BDHLNDR — Windows signing). Credentials are
          # secrets; the non-secret identifiers are repo variables. When the
          # credentials are absent the build is produced UNSIGNED, exactly as
          # before — so this step never fails a release for a repo that has not
          # set signing up yet. See docs/windows-signing.md.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZ_ENDPOINT: ${{ vars.AZURE_CODE_SIGNING_ENDPOINT }}
          AZ_ACCOUNT: ${{ vars.AZURE_CODE_SIGNING_ACCOUNT }}
          AZ_PROFILE: ${{ vars.AZURE_CODE_SIGNING_PROFILE }}
          AZ_PUBLISHER: ${{ vars.AZURE_PUBLISHER_NAME }}
        run: |
          # `bun run build` already ran in the "Build application" step, so this
          # invokes electron-builder directly (as the mac step does).
          #
          # The gate checks EVERY value electron-builder's Azure Trusted Signing
          # needs -- the three credentials AND the three identifiers -- not just
          # some of them. A partially configured repo (e.g. AZURE_CLIENT_ID set
          # but AZURE_TENANT_ID unset or mistyped -- GitHub resolves an unknown
          # secret name to empty, silently) must fall back to UNSIGNED, not take
          # the signed path and fail authenticating to Azure. publisherName is
          # optional, so it is not part of the gate.
          MISSING=()
          [[ -z "$AZURE_TENANT_ID" ]] && MISSING+=(AZURE_TENANT_ID)
          [[ -z "$AZURE_CLIENT_ID" ]] && MISSING+=(AZURE_CLIENT_ID)
          [[ -z "$AZURE_CLIENT_SECRET" ]] && MISSING+=(AZURE_CLIENT_SECRET)
          [[ -z "$AZ_ENDPOINT" ]] && MISSING+=(AZURE_CODE_SIGNING_ENDPOINT)
          [[ -z "$AZ_ACCOUNT" ]] && MISSING+=(AZURE_CODE_SIGNING_ACCOUNT)
          [[ -z "$AZ_PROFILE" ]] && MISSING+=(AZURE_CODE_SIGNING_PROFILE)
          if [[ ${#MISSING[@]} -eq 0 ]]; then
            echo "Azure Trusted Signing configured — signing the Windows build."
            ARGS=( --win
              -c.win.azureSignOptions.endpoint="$AZ_ENDPOINT"
              -c.win.azureSignOptions.codeSigningAccountName="$AZ_ACCOUNT"
              -c.win.azureSignOptions.certificateProfileName="$AZ_PROFILE" )
            # publisherName is optional; pass it only when set so an empty value
            # never overrides the cert's own subject.
            if [[ -n "$AZ_PUBLISHER" ]]; then
              ARGS+=( -c.win.azureSignOptions.publisherName="$AZ_PUBLISHER" )
            fi
            bunx electron-builder "${ARGS[@]}"
          else
            # Names the missing value(s) so a partially-configured repo is
            # diagnosable from the Actions log alone.
            echo "::warning::Azure signing not fully configured (missing: ${MISSING[*]}) — Windows build is UNSIGNED. Smart App Control / SmartScreen will block installs until signing is set up (docs/windows-signing.md)."
            bunx electron-builder --win
          fi

      - name: Build distributables (macOS)
        if: startsWith(matrix.platform, 'mac')
        run: bunx electron-builder --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Puts the temporary signing keychain where the cleanup step finds it.
          APP_BUILDER_TMP_DIR: ${{ runner.temp }}
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Remove the temporary signing keychain
        if: always() && startsWith(matrix.platform, 'mac')
        run: |
          for k in "$RUNNER_TEMP"/*.keychain "$RUNNER_TEMP"/*.keychain-db; do
            [[ -e "$k" ]] || continue
            echo "Deleting $k"
            security delete-keychain "$k" || echo "::warning::could not delete keychain $k"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.platform }}
          # The release job in this same run re-uploads everything to a GitHub
          # Release immediately after; nothing downstream needs this copy.
          retention-days: 1
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: ignore

      # The extension is the same file on every platform, so one job ships it;
      # four same-named copies would race in the release upload.
      - name: Upload the Claude Desktop extension
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-mcpb
          retention-days: 1
          path: dist/mcpb/bodhilander.mcpb
          if-no-files-found: error

  release:
    needs: [check-version, build]
    if: always() && needs.check-version.outputs.should_release == 'true' && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      # BDHLNDR-38: each mac matrix job produces its own arch-scoped
      # latest-mac.yml. Merge into one so electron-updater clients see both
      # DMGs and pick the right arch. Then remove the per-job files so the
      # release upload glob doesn't race on identical filenames.
      - name: Merge latest-mac.yml from arm64 and x64 builds
        run: |
          pip install pyyaml
          python3 scripts/merge-latest-mac.py \
            artifacts/dist-mac-arm64/latest-mac.yml \
            artifacts/dist-mac-x64/latest-mac.yml \
            artifacts/latest-mac.yml
          rm artifacts/dist-mac-arm64/latest-mac.yml artifacts/dist-mac-x64/latest-mac.yml

      # Rename channel feeds for beta releases (BDHLNDR-32). electron-builder's
      # GitHub publish provider always writes `latest*.yml` regardless of the
      # semver pre-release suffix, so we rename them post-build to `beta*.yml`
      # so beta-channel opt-ins can find the feed. This runs AFTER the mac
      # merge so the merged artifacts/latest-mac.yml is renamed too.
      - name: Rename channel feeds for beta releases
        if: needs.check-version.outputs.is_prerelease == 'true'
        run: |
          find artifacts -name "latest*.yml" -type f | while read -r f; do
            newname="${f//latest/beta}"
            mv "$f" "$newname"
            echo "Renamed: $f → $newname"
          done

      - name: Check the Claude Desktop extension is present
        run: |
          if ! ls artifacts/dist-mcpb/*.mcpb >/dev/null 2>&1; then
            echo "::warning::bodhilander.mcpb is missing (the Linux build leg failed?); this release will ship without it."
          fi

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # Dry runs publish a DRAFT under a -dryrun tag suffix: drafts never
          # create the git tag and are invisible to auto-updaters.
          tag_name: v${{ needs.check-version.outputs.version }}${{ inputs.dry_run == true && '-dryrun' || '' }}
          name: ${{ inputs.dry_run == true && format('DRY RUN — Bodhilander v{0}', needs.check-version.outputs.version) || needs.check-version.outputs.is_prerelease == 'true' && format('Bodhilander v{0} (beta)', needs.check-version.outputs.version) || format('Bodhilander v{0}', needs.check-version.outputs.version) }}
          draft: ${{ inputs.dry_run == true }}
          prerelease: ${{ needs.check-version.outputs.is_prerelease }}
          generate_release_notes: true
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.blockmap
            artifacts/**/*.yml
            artifacts/**/*.mcpb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
