name: Build and Release

on:
  push:
    branches:
      - production
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ steps.version.outputs.version }} already exists"
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "Tag v${{ steps.version.outputs.version }} does not exist, will create release"
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          # BDHLNDR-38: build each Mac arch on its native runner so postinstall
          # (electron-rebuild) and sharp's optional-dep resolution produce
          # host-native binaries. Cross-packaging from a single arm64 runner
          # previously shipped arm64 .node files inside the x64 DMG, causing
          # Intel Mac users to hang at the splash screen when better-sqlite3
          # failed to load.
          #
          # macos-15-intel is GitHub's current Intel x64 12-core larger runner
          # (retired macos-13 replacement). It's a paid tier (~$0.077/min, ~$1
          # per release) — larger runners don't use the public-repo free quota.
          - os: macos-14
            platform: mac-arm64
          - os: macos-15-intel
            platform: mac-x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Python (for native module builds)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: bun install

      - name: Build application
        run: bun run build

      - name: Build distributables (Linux)
        if: matrix.platform == 'linux'
        run: bun run dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build distributables (Windows)
        if: matrix.platform == 'win'
        run: bun run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build distributables (macOS)
        if: startsWith(matrix.platform, 'mac')
        run: bunx electron-builder --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.zip
            release/latest*.yml
          if-no-files-found: ignore

  release:
    needs: [check-version, build]
    if: always() && needs.check-version.outputs.should_release == 'true' && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      # BDHLNDR-38: each mac matrix job produces its own arch-scoped
      # latest-mac.yml. Merge into one so electron-updater clients see both
      # DMGs and pick the right arch. Then remove the per-job files so the
      # release upload glob doesn't race on identical filenames.
      - name: Merge latest-mac.yml from arm64 and x64 builds
        run: |
          pip install pyyaml
          python3 scripts/merge-latest-mac.py \
            artifacts/dist-mac-arm64/latest-mac.yml \
            artifacts/dist-mac-x64/latest-mac.yml \
            artifacts/latest-mac.yml
          rm artifacts/dist-mac-arm64/latest-mac.yml artifacts/dist-mac-x64/latest-mac.yml

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: Bodhilander v${{ needs.check-version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
