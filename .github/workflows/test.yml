name: Tests

on:
  push:
    branches:
      - development
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# Cancel superseded runs only on pull requests; pushes to development run to
# completion so the branch's check history stays gap-free.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Windows is a shipped platform, and its failures — path separators, 8.3
    # short paths, POSIX-only shell syntax — are invisible from Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows runners are markedly slower at install and native-free spawns.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Exact pin: bun:test module-mock semantics changed between minors
          # (1.4.0 shares one mock registry across files unless --isolate), so
          # a floating runtime can flip this gate without any code change.
          bun-version: 1.4.0

      # --ignore-scripts skips postinstall's electron-rebuild, which needs an
      # Electron download and a native toolchain. The suites never load a
      # native module: they use bun:sqlite and mock node-pty.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install relay dependencies
        run: bun install --frozen-lockfile
        working-directory: relay

      # Discovers every *.test.ts(x) under the repo, relay/ included.
      # --isolate gives each file its own module registry, so one file's
      # mock.module can never become another file's subject.
      - name: Run app suite
        run: bun test --isolate

      # The relay deploys against its own lockfile (relay/bun.lock), so its
      # suite must also pass standalone from relay/. --isolate for the same
      # reason as above — the first relay mock.module must not change this.
      - name: Run relay suite
        run: bun test --isolate
        working-directory: relay

  # Nothing on a pull request has ever run `postinstall`. The suites above
  # install with --ignore-scripts, so the only thing that exercises
  # electron-rebuild is a release build -- which is how a postinstall that
  # cannot complete without Visual Studio stayed invisible until a run engine
  # cut a fresh worktree and got exit 255 from `bun install`.
  #
  # This job is that missing check, and it asserts the two things a release
  # and a provisioner both need: the install finishes, and the native module
  # it produced actually loads and works. Loading is not enough on its own --
  # a binary for the wrong ABI can be present and still fail at the first
  # call -- so it spawns a real pty and reads its own output back.
  #
  # It runs on every PR rather than only when package.json changes: an
  # electron-rebuild failure can arrive from a transitive bump in the
  # lockfile, or from a runner image moving underneath us, neither of which
  # touches a path filter.
  native-install:
    name: postinstall produces a working native module
    strategy:
      fail-fast: false
      matrix:
        # windows-2022 to match release.yml, which is pinned there on purpose
        # (#109): windows-latest now means VS 2026, which node-gyp cannot
        # detect. Testing on a runner the release does not use would answer a
        # question nobody asked.
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Setup Python (node-gyp needs it)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      # No --ignore-scripts. That is the whole point of this job.
      - name: Install for real, postinstall included
        run: bun install --frozen-lockfile

      - name: The native module loads and works under node
        run: node .github/scripts/check-native.js

      # The one that actually answers the question. node-pty's prebuilds (and
      # node-gyp, where none matches) target NODE's headers
      # -- and what ships is loaded by ELECTRON. node-pty builds against
      # node-addon-api, so N-API is supposed to make those the same thing.
      # "Supposed to" is not a check, and running the node binary under node
      # proves nothing about the pairing that matters.
      #
      # xvfb on linux because Electron initialises a display even for a script
      # that never opens a window.
      - name: The native module loads and works under Electron
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ./node_modules/.bin/electron --no-sandbox .github/scripts/check-native.js
          else
            ./node_modules/.bin/electron .github/scripts/check-native.js
          fi
